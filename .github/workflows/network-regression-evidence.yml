name: Network Regression Evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: network-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize only pinned core and rules sources
        run: git submodule update --init --depth 1 -- sing-box rules src/MagicNet/.config/sing-box
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Compile the exact configured core
        run: scripts/build-sing-box.sh linux amd64 "$RUNNER_TEMP/core/sing-box"
      - name: Verify DNS proxy egress and closed failure with the production core
        run: python3 scripts/test-dns-proxy-egress.py --core "$RUNNER_TEMP/core/sing-box" --require
      - name: Exercise the exact packaged subscription converter
        run: |
          revision=$(sed -n 's/^PINNED_REV="\(.*\)"/\1/p' hooks/pre-build/4910.update_proxylink.sh)
          test "${#revision}" = 40
          git clone https://github.com/Fanju6/Proxylink.git "$RUNNER_TEMP/proxylink-source"
          git -C "$RUNNER_TEMP/proxylink-source" checkout "$revision"
          (cd "$RUNNER_TEMP/proxylink-source/Proxylink" && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/proxylink" .)
          python3 scripts/test-clash-subscriptions.py --converter "$RUNNER_TEMP/proxylink"
      - name: Validate removal with the real core and exercise read-only feedback
        run: |
          node --experimental-strip-types scripts/test-tailscale-core.mjs "$RUNNER_TEMP/core/sing-box"
          python3 scripts/test-feedback-snapshot.py
      - name: Prepare checksum-verified local rules
        env:
          KAM_PROJECT_ROOT: ${{ github.workspace }}
          KAM_HOOKS_ROOT: ${{ github.workspace }}/hooks
          KAM_MODULE_ROOT: ${{ github.workspace }}/src/MagicNet
        run: bash hooks/pre-build/5450.update_sing_box_rules.sh
      - name: Measure isolated host memory, not physical-device acceptance
        run: |
          python3 scripts/profile-core-memory.py --core "$RUNNER_TEMP/core/sing-box" \
            --config src/MagicNet/.config/sing-box/config.json --output artifacts/core-memory.json
      - name: Measure bounded loopback forwarding with the production core
        run: |
          python3 scripts/test-host-connectivity-performance.py \
            --core "$RUNNER_TEMP/core/sing-box" --output artifacts/host-forwarding.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-memory-evidence
          path: |
            artifacts/core-memory.json
            artifacts/host-forwarding.json
          if-no-files-found: error
  visual-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Exercise subscription and Tailscale flows and capture every page
        working-directory: webui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          npx playwright test e2e/tailscale.spec.mjs e2e/page-review.spec.mjs e2e/subscription-sources.spec.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: webui-page-evidence
          path: webui/test-results/
          if-no-files-found: error
  avd-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute AVD path and failed-create contracts
        run: python3 scripts/test-android-avd-storage.py
      - name: Create and discover a real isolated SDK AVD
        run: python3 scripts/test-android-avd-storage.py --sdk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avd-storage-evidence
          path: artifacts/avd-storage.json
          if-no-files-found: error
          retention-days: 7
