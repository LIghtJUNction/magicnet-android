name: Issue 436 host observer validation
on:
  push:
    branches: [diagnostic/issue-436-host-20261113]
permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify unchanged device controls and existing dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml'
          git diff --check 668701523f52959f2daf5113ee11b716aa7ecddb HEAD
          git diff --exit-code 668701523f52959f2daf5113ee11b716aa7ecddb HEAD -- \
            scripts/android-device-simulation.py \
            scripts/test-android-device-simulation.py \
            scripts/android-route-recovery-proof.py \
            scripts/require-android-acceptance.py \
            scripts/test-android-release-gate.py \
            tests/fixtures/android-route-recovery-cellular.json
          mkdir -p artifacts/host-observer-validation
      - name: Test actual host processes and bounded observations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-android-host-observer.py -v 2>&1 | tee artifacts/host-observer-validation/helper.txt
      - name: Test original reboot contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-android-device-simulation.py -v \
            DeviceTests.test_reboot_verifies_native_init_only_after_android_boot \
            DeviceTests.test_reboot_timeout_requires_new_boot_and_all_postconditions_without_replay \
            DeviceTests.test_reboot_timeout_cannot_pass_unchanged_missing_or_incomplete_boot \
            DeviceTests.test_reboot_non_timeout_command_errors_fail_before_boot_observation \
            DeviceTests.test_reboot_timeout_never_swallows_root_selinux_or_kernelsu_failure \
            DeviceTests.test_reboot_requires_a_valid_old_identity_before_issuing_the_command \
            2>&1 | tee artifacts/host-observer-validation/reboot.txt
      - name: Test workflow and independent acceptance contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-android-simulation-workflow.py -v 2>&1 | tee artifacts/host-observer-validation/workflow.txt
          python3 scripts/test-android-release-gate.py -v 2>&1 | tee artifacts/host-observer-validation/gate.txt
      - name: Record immutable validation inputs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          names = [
              'scripts/android-host-observer.py',
              'scripts/test-android-host-observer.py',
              '.github/workflows/android-kernelsu-acceptance.yml',
              'scripts/test-android-simulation-workflow.py',
              'docs/android-kernelsu-ci.md',
              '.github/workflows/issue-436-host-diagnostic.yml',
              'scripts/android-device-simulation.py',
              'scripts/android-route-recovery-proof.py',
              'scripts/require-android-acceptance.py',
          ]
          out = Path('artifacts/host-observer-validation')
          out.mkdir(parents=True,exist_ok=True)
          report = {
              'schema':1,
              'source_sha':os.environ['GITHUB_SHA'],
              'scope':'host-process-and-contract-validation-only',
              'full_android_acceptance':False,
              'input_sha256':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names},
              'log_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.glob('*.txt')},
          }
          (out/'validation-inputs.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Upload bounded validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue-436-host-validation
          path: artifacts/host-observer-validation
          retention-days: 14
          if-no-files-found: error
