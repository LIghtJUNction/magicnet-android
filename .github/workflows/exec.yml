name: Build MagicNet source

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact magicnet-android commit selected by the release plan
        required: true
        type: string
      recipe_sha:
        description: Exact MagicNet recipe or release snapshot commit
        required: true
        type: string
      release_version:
        description: Selected vMAJOR.MINOR.PATCH module version
        required: true
        type: string
      release_version_code:
        description: Selected positive Android versionCode
        required: true
        type: string
      release_quality:
        description: Run every release quality check without cached test results
        type: boolean
        default: false
    outputs:
      artifact_id:
        description: Immutable artifact containing the verified module packages
        value: ${{ jobs.build.outputs.artifact_id }}
  workflow_dispatch:
    inputs:
      force_tests:
        description: Ignore previous test results and run every check
        required: false
        type: boolean
        default: false
      release_quality:
        description: Run the full build quality suite; publish versions from MagicNet/release.yml
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: magicnet-source-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_TEST_FORCE: ${{ (inputs.force_tests == true || inputs.release_quality == true) && '1' || '0' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      KAM_CHANGELOG_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT_SHA: ${{ inputs.source_sha || github.sha }}
      CARGO_NDK_VERSION: "4.1.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.source_sha && 'LIghtJUNction/magicnet-android' || github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Verify selected source and version
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RECIPE_SHA: ${{ inputs.recipe_sha }}
          SELECTED_VERSION: ${{ inputs.release_version }}
          SELECTED_VERSION_CODE: ${{ inputs.release_version_code }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          prop = tomllib.loads(Path("kam.toml").read_text())["prop"]
          version = os.environ["SELECTED_VERSION"]
          code = os.environ["SELECTED_VERSION_CODE"]
          recipe = os.environ["RECIPE_SHA"]
          if bool(version) != bool(code):
              raise SystemExit("Both release_version and release_version_code are required together")
          if recipe and not re.fullmatch(r"[0-9a-f]{40}", recipe):
              raise SystemExit("Invalid recipe snapshot SHA")
          if recipe and not version:
              raise SystemExit("A recipe build requires an explicit version and versionCode")
          version = version or prop["version"]
          code = code or str(prop["versionCode"])
          if not re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version):
              raise SystemExit("Invalid selected version")
          if not re.fullmatch(r"[1-9][0-9]*", code) or int(code) > 2147483647:
              raise SystemExit("Invalid selected versionCode")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RELEASE_VERSION={version}\nRELEASE_VERSION_CODE={code}\n")
          PY

      - name: Stamp selected build version
        run: |
          python3 scripts/stamp-release.py --version "$RELEASE_VERSION" --version-code "$RELEASE_VERSION_CODE"
          cp update.json "$RUNNER_TEMP/selected-update.json"

      # Cache restoration must not change the selected metadata or source SHA.
      - name: Restore per-check test results
        uses: ./.github/actions/test-cache
        with:
          mode: restore

      - name: Verify pinned build submodules
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-submodule-revisions.sh
          git submodule status --recursive > "$RUNNER_TEMP/build-submodules.txt"

      - name: Setup Go for forked sing-box
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.7"
          cache: false

      - name: Setup kam
        uses: MemDeco-WG/setup-kam@2a0e9193a7e84dc7da78e99af586f8a4bb823bcb
        with:
          github-token: ${{ github.token }}
          enable-cache: "true"
          # Do not restore ~/.rustup over the freshly installed Rust toolchain.
          cache-targets: kam
          install-commitizen: "false"

      - name: Fingerprint build toolchains
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$ndk" ] && [ -d "${ANDROID_HOME:-}/ndk" ]; then
            ndk="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          fi
          ndk="${ndk:-/opt/android-ndk}"
          rust_hash="$(rustc -vV | sha256sum | cut -d' ' -f1)"
          ndk_hash="$(sha256sum "$ndk/source.properties" | cut -d' ' -f1)"
          printf 'rust=%s\nndk=%s\n' "$rust_hash" "$ndk_hash" >> "$GITHUB_OUTPUT"
          printf 'singbox=%s\n' "$(git -C sing-box rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Go dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('sing-box/go.mod', 'sing-box/go.sum') }}-${{ steps.toolchain.outputs.singbox }}-${{ hashFiles('scripts/build-sing-box.sh', 'sing-box.version') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('sing-box/go.mod', 'sing-box/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-singbox-go-v2-${{ steps.go.outputs.go-version }}-${{ steps.toolchain.outputs.ndk }}-

      - name: Cache Rust dependencies and Android build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'hooks/pre-build/3000.BUILD_CRATES.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-${{ hashFiles('Cargo.lock', '.cargo/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-module-rust-v2-${{ steps.toolchain.outputs.rust }}-${{ steps.toolchain.outputs.ndk }}-

      - name: Cache verified curl source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/magicnet/curl/sources
          key: ${{ runner.os }}-android-curl-sources-v1-${{ hashFiles('scripts/android-curl-lock.json') }}

      - name: Setup Node.js and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Cache Bun package downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v1-${{ hashFiles('webui/bun.lock', 'webui/bun.lockb', 'webui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-v1-

      - name: Cache cargo-ndk executable
        id: cargo-ndk
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/magicnet/cargo-ndk
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ steps.toolchain.outputs.rust }}

      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install Android cargo build tool
        if: ${{ steps.cargo-ndk.outputs.cache-hit != 'true' }}
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --root "$HOME/.cache/magicnet/cargo-ndk"

      - name: Add Android cargo build tool to PATH
        run: echo "$HOME/.cache/magicnet/cargo-ndk/bin" >> "$GITHUB_PATH"

      - name: Install artifact tools
        run: sudo apt-get update && sudo apt-get install -y binutils busybox-static file jq ripgrep unzip zip python3-yaml shellcheck mksh make perl pkg-config

      - name: Test forked sing-box eBPF support
        shell: bash
        run: python3 scripts/ci-test-cache.py singbox singbox-ebpf -- bash scripts/test-singbox-ebpf.sh

      - name: Build host sing-box from fork
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/sing-box-host"
          mkdir -p "$install_dir"
          scripts/build-sing-box.sh linux amd64 "$install_dir/sing-box" >/dev/null
          sudo install -m 0755 "$install_dir/sing-box" /usr/local/bin/sing-box
          expected_revision="$(git -C sing-box rev-parse HEAD)"
          version_output="$(sing-box version)"
          grep -F "LIghtJUNction.${expected_revision:0:12}" <<<"$version_output"
          printf '%s\n' "$version_output"
          python3 scripts/test-android-tun-proof.py --check-core "$(command -v sing-box)"
          python3 scripts/test-dns-loopback-listeners.py --core "$(command -v sing-box)"

      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail
          kam --version
          gh --version
          cargo ndk --version

      - name: Build module
        env:
          MAGICNET_CURL_NDK_SHA256: ${{ steps.toolchain.outputs.ndk }}
        shell: bash
        run: |
          set -euo pipefail
          export MAGICNET_CURL_SOURCE_CACHE="$HOME/.cache/magicnet/curl/sources"
          find hooks src -type f -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          rm -rf dist
          kam build
          # KAM's generic exporter points zipUrl at the module archive. MagicNet
          # restores only that URL, then verifies every other generated field.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          selected = json.loads((Path(os.environ["RUNNER_TEMP"]) / "selected-update.json").read_text())
          path = Path("update.json")
          generated = json.loads(path.read_text())
          generated["zipUrl"] = selected["zipUrl"]
          path.write_text(json.dumps(generated, ensure_ascii=False, indent=2) + "\n")
          PY
          python3 scripts/stamp-release.py --version "$RELEASE_VERSION" --version-code "$RELEASE_VERSION_CODE" --verify
          git submodule status --recursive > "$RUNNER_TEMP/built-submodules.txt"
          diff -u "$RUNNER_TEMP/build-submodules.txt" "$RUNNER_TEMP/built-submodules.txt"
          cp "$RUNNER_TEMP/build-submodules.txt" dist/build-submodules.txt

      - name: Verify artifact contents
        shell: bash
        run: |
          set -euo pipefail
          module_id="$(sed -n 's/^id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' kam.toml | head -n1)"
          test -n "$module_id"
          test -f "dist/${module_id}.zip"
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'module.prop'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'cli'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/magicnet-cli'
          unzip -Z1 "dist/${module_id}.zip" | grep -Fx 'bin/sing-box'
          if unzip -Z1 "dist/${module_id}.zip" | grep -Eq '(^|/)\.git($|/)'; then
            echo "::error::Module archive contains Git metadata"
            exit 1
          fi
          scripts/package-smoke.sh "dist/${module_id}.zip"
          scripts/package-install-smoke.sh "dist/${module_id}.zip"
          scripts/fake-magisk-smoke.sh "dist/${module_id}.zip"

      - name: Package core, components and offline full module
        shell: bash
        run: |
          set -euo pipefail
          GO111MODULE=off CGO_ENABLED=0 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags='-s -w -buildid=' \
              -o "$RUNNER_TEMP/magicnet-components" ./installer/components
          bash scripts/quality-gate.sh components
          python3 scripts/package-components.py dist/MagicNet.zip \
            --helper "$RUNNER_TEMP/magicnet-components" --output dist \
            --repository LIghtJUNction/MagicNet
          scripts/package-smoke.sh dist/MagicNet-full.zip
          cat dist/package-sizes.json >> "$GITHUB_STEP_SUMMARY"

      - name: Verify incremental MagicNet installer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-downloader-installer.py dist/magicnet_installer.zip \
            --core dist/MagicNet-core.zip

      # The recipe workflow requests these checks and separately requires the
      # Android acceptance workflow for the same source SHA and stamped version.
      - name: Cache release browser binaries
        if: ${{ inputs.release_quality == true }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('webui/package-lock.json') }}

      - name: Prepare release quality dependencies
        if: ${{ inputs.release_quality == true }}
        run: |
          rustup component add clippy rustfmt
          cd webui
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Compile release acceptance test APK
        if: ${{ inputs.release_quality == true }}
        run: |
          scripts/build-android-network-probe.sh --prepare-sdk "$RUNNER_TEMP/magicnet-network-probe.apk"

      - name: Release quality gate
        id: release_quality
        env:
          CI_TEST_FORCE: "1"
        if: ${{ inputs.release_quality == true }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          bash scripts/quality-gate.sh all
          git submodule status --recursive > "$RUNNER_TEMP/quality-submodules.txt"
          diff -u "$RUNNER_TEMP/build-submodules.txt" "$RUNNER_TEMP/quality-submodules.txt"
          python3 scripts/stamp-release.py --version "$RELEASE_VERSION" --version-code "$RELEASE_VERSION_CODE" --verify

      - name: Record immutable build provenance
        env:
          RECIPE_SHA: ${{ inputs.recipe_sha }}
        run: |
          set -euo pipefail
          python3 scripts/stamp-release.py --version "$RELEASE_VERSION" --version-code "$RELEASE_VERSION_CODE" --verify
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_SHA"
          cp update.json dist/update.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          recipe = os.environ["RECIPE_SHA"]
          provenance = {
              "schema": 1,
              "repository": "LIghtJUNction/MagicNet" if recipe else "LIghtJUNction/magicnet-android",
              "source_repository": "LIghtJUNction/magicnet-android",
              "source_sha": os.environ["RELEASE_COMMIT_SHA"],
              "version": os.environ["RELEASE_VERSION"],
              "version_code": os.environ["RELEASE_VERSION_CODE"],
          }
          if recipe:
              provenance["recipe_sha"] = recipe
          Path("dist/build-source.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PY

      - name: Generate release checksums
        run: bash scripts/checksum-release-assets.sh dist

      - name: Save successful per-check results
        if: ${{ always() && !cancelled() }}
        uses: ./.github/actions/test-cache
        with:
          mode: save

      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: magicnet-module-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
